version: 2

models:
  - name: dim_country
    description: "One row per country."
    columns:
      - name: country_key
        tests: [unique, not_null]
      - name: country_code
        tests: [unique, not_null]

  - name: dim_indicator
    description: "One row per indicator."
    columns:
      - name: indicator_key
        tests: [unique, not_null]
      - name: indicator_code
        tests: [unique, not_null]

  - name: dim_year
    description: "One row per year."
    columns:
      - name: year_key
        tests: [unique, not_null]
      - name: year
        tests: [unique, not_null]

  - name: fact_indicator
    description: "Grain: one row per country x indicator x year. Referential integrity to all dims."
    columns:
      - name: country_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_country')
              field: country_key
      - name: indicator_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_indicator')
              field: indicator_key
      - name: year_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_year')
              field: year_key
