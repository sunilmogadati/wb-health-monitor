[project]
name = "wb-health-monitor"
version = "0.1.0"
description = "wb-health-monitor platform API."
requires-python = ">=3.11"

dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]>=3.1,<4",
  "boto3>=1.34",
  "wbgapi>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "mypy==1.14.0",
  "ruff==0.8.4",
]
# Modeling deps for spec 002 (ml.train). Run training on the host: pip install -e "backend[ml]"
ml = [
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "xgboost>=2.0,<3.0",
  "joblib>=1.3",
]
# Warehouse transform deps for spec 003 (dbt). Run on the host: pip install -e "backend[warehouse]"
warehouse = [
  "dbt-postgres>=1.7,<2",
]
# LLM / agent deps for the Claude brief (spec 002) and RAG insights (spec 004).
ai = [
  "anthropic>=0.40",
  "langchain>=0.3",
  "langchain-anthropic>=0.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ml*", "ai*", "evals*", "scripts*"]

# Ruff configuration lives in the REPOSITORY ROOT (`ruff.toml`), not here, so a single config covers
# backend/ and its sibling tests/ regardless of a job's working directory.

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Generated migration scripts are not worth strict-typing.
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# The scientific / vendor stack: some ship a py.typed (pandas, sklearn, numpy) whose stubs use
# 3.12+ syntax our target can't parse, others ship none. `follow_imports = skip` makes mypy treat
# them all as untyped without analysing their stubs — the only reliable way to keep strict mode on
# our own code without pulling the numpy stub-syntax crash into the build.
[[tool.mypy.overrides]]
module = [
  "numpy", "numpy.*",
  "pandas", "pandas.*",
  "sklearn", "sklearn.*",
  "scipy", "scipy.*",
  "joblib", "joblib.*",
  "xgboost", "xgboost.*",
  "boto3", "boto3.*",
  "botocore", "botocore.*",
  "wbgapi", "wbgapi.*",
  "langchain", "langchain.*",
  "langchain_anthropic", "langchain_anthropic.*",
  "anthropic", "anthropic.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Tests live at the repository root, a sibling of backend/. Paths are relative to this file.
testpaths = ["../tests"]
addopts = "-r fEs --strict-markers"
