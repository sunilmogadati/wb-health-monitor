# wb-health-monitor — local development stack.
# Copy .env.example to .env before running: `docker compose up --build`.
name: wb-health-monitor

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wb-health-monitor-api
    container_name: wb-health-monitor-api
    # Bind-mount the source so --reload (baked into the image CMD) picks up edits.
    volumes:
      - ./backend:/workspace/backend
      - ./tests:/workspace/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    # Inside the compose network the DB host is the service name `db` (and MinIO is `minio`).
    # `.env` sets these to `localhost`/`http://localhost:9000` for HOST-run tools (make ingest/train);
    # these overrides point the CONTAINER at the compose services. See docs/DEPLOYMENT.md / .env.example.
    environment:
      POSTGRES_HOST: db
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: wb-health-monitor-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wb-health-monitor-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Object storage (S3-compatible). The immutable "raw" landing zone for ingested data.
  # Runs locally, no cloud account, no cost. See docs/data-and-storage.md.
  minio:
    image: minio/minio:latest
    container_name: wb-health-monitor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API (apps connect here)
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console (you browse here)
    volumes:
      - wb-health-monitor-minio-data:/data
    restart: unless-stopped

volumes:
  wb-health-monitor-db-data:
  wb-health-monitor-minio-data:
