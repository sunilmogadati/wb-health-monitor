# wb-health-monitor — local development stack.
# Copy .env.example to .env before running: `docker compose up --build`.
name: wb-health-monitor

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wb-health-monitor-api
    container_name: wb-health-monitor-api
    # Bind-mount the source so --reload (baked into the image CMD) picks up edits.
    volumes:
      - ./backend:/workspace/backend
      - ./tests:/workspace/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: wb-health-monitor-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wb-health-monitor-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  wb-health-monitor-db-data:
