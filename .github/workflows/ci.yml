# wb-health-monitor — Python service CI.
# Runs on every push and pull request. Every step is required: lint (ruff),
# type check (mypy), and tests (pytest) all gate the build, and any one failing
# fails the job.
#
# Layout note: dependencies and their configs live under backend/ (pyproject.toml,
# mypy config, pytest testpaths=../tests), while ruff.toml sits at the repository
# root so `ruff check .` covers backend/ and its sibling tests/ in one pass.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ruff · mypy · pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # ml + ai extras so mypy resolves and pytest can import the model/AI modules.
          pip install -e ".[dev,ml,ai]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        working-directory: backend
        run: mypy .

      - name: Test (pytest)
        working-directory: backend
        run: pytest
